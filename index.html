<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F14">
<title>Bethoven - Solo Negocio $100</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
*{ -webkit-tap-highlight-color:transparent }
body{font-family:'Plus Jakarta Sans',sans-serif}
.font-display{font-family:'Space Grotesk',sans-serif}
.filled{background:radial-gradient(at 30% 20%,#FFD93D,#FF5A1F)}
.empty{border:2px dashed #2E2E3D}
button:active{transform:scale(.97)}
input{font-size:16px !important}
</style>
</head>
<body class="bg-[#0F0F14] text-white min-h-[100dvh] flex flex-col">
<header class="sticky top-0 z-20 bg-[#0F0F14]/90 backdrop-blur-xl p-3 flex justify-between items-center border-b border-white/10">
<div class="flex gap-2.5 items-center">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-orange-500 to-yellow-300 grid place-items-center text-black font-bold">♫</div>
<div class="leading-none">
<h1 class="font-display font-bold text-[15px]">BETHOVEN</h1>
<p class="text-[10px] text-orange-400 font-bold tracking-widest">PANEL NEGOCIO - $100</p>
</div>
</div>
<button id="btnSalir" onclick="logout()" class="hidden px-4 py-2.5 rounded-full bg-white/10 text-[12px]">Salir</button>
</header>

<!-- Login -->
<div id="login" class="fixed inset-0 z-50 bg-[#0F0F14] grid place-items-center p-4">
<div class="bg-[#1A1A22] rounded-[24px] p-6 w-full max-w-[320px] border border-white/10 text-center">
<div class="w-12 h-12 mx-auto rounded-2xl bg-gradient-to-br from-orange-500 to-yellow-300 grid place-items-center text-black font-bold text-xl mb-3">♫</div>
<p class="font-display font-bold text-lg">Recargas Bethoven</p>
<p class="text-[12px] opacity-50 mb-4">Ingresa PIN para gestionar sellos</p>
<input id="passInput" type="password" placeholder="PIN" class="w-full p-4 rounded-2xl bg-black/50 border border-white/10 text-center text-lg tracking-widest outline-none">
<button onclick="checkPass()" class="w-full mt-3 py-4 rounded-2xl bg-white text-black font-bold">Entrar</button>
<p class="text-[10px] opacity-30 mt-3">PIN por defecto: bethoven123</p>
</div></div>

<main id="main" class="hidden flex-1 w-full max-w-6xl mx-auto p-3">
<div class="flex flex-col sm:flex-row gap-2 mb-4">
<input id="q" oninput="render()" placeholder="Buscar cliente por nombre o WhatsApp..." class="flex-1 px-5 py-3.5 rounded-full bg-[#1A1A22] border border-white/10 outline-none text-[14px]">
<button onclick="document.getElementById('add').classList.toggle('hidden')" class="px-6 py-3.5 rounded-full bg-white text-black font-bold text-[14px]">+ Cliente</button>
</div>

<div id="add" class="hidden bg-[#1A1A22] p-3 rounded-[20px] border border-white/10 mb-4">
<div class="flex flex-col sm:flex-row gap-2">
<input id="nName" placeholder="Nombre del cliente" class="flex-1 p-3.5 rounded-xl bg-black/40 border border-white/10 outline-none">
<input id="nPhone" type="tel" inputmode="numeric" placeholder="WhatsApp 10 dígitos" class="flex-1 p-3.5 rounded-xl bg-black/40 border border-white/10 outline-none">
<button onclick="add()" class="px-8 py-3.5 rounded-xl bg-orange-500 text-black font-bold">Agregar</button>
</div>
</div>

<div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>

<div class="mt-8 p-4 rounded-2xl bg-white/5 border border-white/5 text-[11px] opacity-40 text-center">
Cada sello abre WhatsApp automático al cliente con su avance: X/10 para su recarga de $100 gratis.
</div>
</main>

<div id="toast" class="fixed bottom-[calc(16px+env(safe-area-inset-bottom))] left-1/2 -translate-x-1/2 bg-white text-black px-5 py-3 rounded-full font-bold text-[13px] hidden z-50 shadow-xl max-w-[90vw] text-center"></div>

<script>
const KEY='bethoven_v3';
let stored=JSON.parse(localStorage.getItem(KEY)||'null');
let S;
if(stored){
  S=stored;
  S.config.rewardAmount='$100';
  S.config.rewardText='Recarga Gratis';
  S.config.stampsNeeded=10;
} else {
  S={config:{businessName:'Recargas Bethoven',stampsNeeded:10,rewardAmount:'$100',rewardText:'Recarga Gratis',pin:'bethoven123'},clients:[]};
}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));

function checkPass(){
  if(document.getElementById('passInput').value===S.config.pin){
    sessionStorage.setItem('bethoven_admin','1');
    document.getElementById('login').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
    document.getElementById('btnSalir').classList.remove('hidden');
    render();
  } else toast('PIN incorrecto');
}
function logout(){
  sessionStorage.removeItem('bethoven_admin');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('main').classList.add('hidden');
  document.getElementById('btnSalir').classList.add('hidden');
  document.getElementById('passInput').value='';
}

// WhatsApp
function getWaLink(phone, text){
  let p=(phone+'').replace(/\D/g,'');
  if(p.length===10) p='52'+p;
  if(p.startsWith('521') && p.length===13) p='52'+p.slice(3);
  return `https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}
function buildMsg(c){
  const need=S.config.stampsNeeded;
  if(c.stamps>=need){
    return `Hola ${c.name}! 🎵✨\n\n¡FELICIDADES! Completaste ${c.stamps}/${need} sellos en Bethoven.\n\n🎁 Premio: ${S.config.rewardAmount} de recarga GRATIS\nPasa a mostrador para canjear.\n\n¡Gracias! ♫`;
  } else {
    return `Hola ${c.name}! 🎵\n\nSello registrado en Bethoven.\nLlevas: ${c.stamps}/${need} sellos\nTe faltan: ${need-c.stamps} para tu recarga de $100 GRATIS\n\n¡Te esperamos! ♫`;
  }
}
function add(){
  const name=document.getElementById('nName').value.trim();
  const phone=document.getElementById('nPhone').value.replace(/\D/g,'');
  if(!name||!phone) return toast('Faltan datos');
  if(phone.length<10) return toast('WhatsApp incompleto');
  S.clients.unshift({id:Date.now()+'',name,phone,stamps:0,totalEarned:0,redeemed:0});
  save(); render();
  document.getElementById('nName').value=''; document.getElementById('nPhone').value='';
  document.getElementById('add').classList.add('hidden');
  toast('Cliente agregado');
}
function addS(id){
  const c=S.clients.find(x=>x.id==id); if(!c) return;
  if(c.stamps>=S.config.stampsNeeded) return toast('Listo para canjear $100');
  c.stamps++; c.totalEarned++; save(); render();
  window.open(getWaLink(c.phone, buildMsg(c)), '_blank');
}
function redeem(id){
  const c=S.clients.find(x=>x.id==id);
  if(c.stamps<S.config.stampsNeeded) return;
  if(!confirm(`¿Canjear $100 para ${c.name}?`)) return;
  c.stamps-=S.config.stampsNeeded; c.redeemed++; save(); render();
  const code='BETH100-'+Math.random().toString(36).slice(2,6).toUpperCase();
  window.open(getWaLink(c.phone, `Hola ${c.name}! 🎁 Canjeaste tu RECARGA DE $100 GRATIS en Bethoven. Código: ${code}. Muéstralo en mostrador.`), '_blank');
}
function sendWA(id){
  const c=S.clients.find(x=>x.id==id); if(!c) return;
  window.open(getWaLink(c.phone, buildMsg(c)), '_blank');
}
function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  const list=S.clients.filter(c=>c.name.toLowerCase().includes(q)||c.phone.includes(q));
  document.getElementById('grid').innerHTML=list.map(c=>{
    const need=S.config.stampsNeeded; const can=c.stamps>=need;
    const pct=Math.round(c.stamps/need*100);
    const stamps=Array.from({length:need}).map((_,i)=>`<div class="w-[30px] h-[30px] rounded-full grid place-items-center text-[11px] font-bold ${i<c.stamps?'filled text-black':'empty text-white/30'}">${i<c.stamps?'♪':''}</div>`).join('');
    return `<div class="bg-[#1A1A22] border border-white/10 rounded-[20px] p-4">
      <div class="flex justify-between"><div class="min-w-0 flex-1"><p class="font-bold truncate">${c.name}</p><p class="text-[11px] opacity-50">${c.phone} • ${c.stamps}/${need} • ${pct}%</p></div>
      <button onclick="if(confirm('¿Eliminar?')){S.clients=S.clients.filter(x=>x.id!='${c.id}');save();render()}" class="w-8 h-8 rounded-full bg-white/5 grid place-items-center text-white/30">✕</button></div>
      <div class="flex flex-wrap gap-2 mt-3">${stamps}</div>
      <div class="mt-3 h-1.5 bg-white/10 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-orange-500 to-yellow-300" style="width:${pct}%"></div></div>
      <div class="flex gap-2 mt-4">
        <button onclick="addS('${c.id}')" class="flex-1 py-3.5 rounded-full bg-white text-black font-bold text-[13px]">+1 Sello</button>
        <button onclick="redeem('${c.id}')" class="px-5 py-3.5 rounded-full ${can?'bg-yellow-300 text-black':'bg-white/10 text-white/30'} text-[13px] font-bold">Canjear</button>
      </div>
      <button onclick="sendWA('${c.id}')" class="w-full mt-2 py-3 rounded-full bg-[#25D366] text-black font-bold text-[12px]">💬 WhatsApp: ${c.stamps}/${need}</button>
    </div>`;
  }).join('');
  if(list.length===0) document.getElementById('grid').innerHTML='<p class="col-span-full text-center opacity-30 py-16 text-sm">Sin clientes.<br>Agrega uno para empezar.</p>';
}
function toast(m){ const t=document.getElementById('toast'); t.innerText=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2500); }
if(sessionStorage.getItem('bethoven_admin')==='1'){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('btnSalir').classList.remove('hidden');
  render();
}
</script>
</body>
</html>
